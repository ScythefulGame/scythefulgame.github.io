<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Contributors - Scytheful</title>

        <style>
            @font-face 
            {
                font-family: 'Lexend';
                src: url('assets/fonts/Lexend/Lexend-Regular.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }

            @font-face {
                font-family: 'Lexend';
                src: url('assets/fonts/Lexend/Lexend-Bold.ttf') format('truetype');
                font-weight: bold;
                font-style: normal;
            }

            :root 
            {
                --bg-navy: #0a1c33;
                --header-blue: #1560d6;
                --banner-blue: #1a3f78;
                --hero-navy: #0d2544;
                --accent-cyan: #38b3ff;
                --text-white: #f2f6fb;
            }

            body 
            {
                margin: 0;
                font-family: 'Lexend', sans-serif;
                color: var(--text-white);
        
                background-color: var(--bg-navy);
                background-image: url('assets/generic_items/dark_checkers.png');
                background-repeat: repeat;
            }

            /* ---------- HEADER ---------- */
            header 
            {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: var(--header-blue);
                padding: 14px 32px;
            }
        
            .brand 
            {
                display: flex;
                align-items: center;
                gap: 12px;
            }
        
            .brand img 
            {
                height: 34px;
            }
        
            .brand span 
            {
                font-weight: bold;
                font-size: 20px;
                color: #fff;
            }
        
            nav 
            {
                display: flex;
                gap: 28px;
            }
        
            nav a 
            {
                color: #eaf2ff;
                font-weight: 600;
                text-decoration: none;
            }
        
            nav a:hover,
            nav a.active 
            {
                text-decoration: underline;
            }

            /* ---------- HERO ---------- */
            .hero 
            {
                text-align: center;
                padding: 70px 24px 60px;
                background-color: var(--hero-navy);
    
                background-image: url('assets/generic_items/lined_background_alt.png');
                background-repeat: repeat;
            }

            .hero h1 
            {
                font-size: 56px;
                font-weight: 800;
                margin: 0 0 20px;
                color: #fff;
            }
        
            .hero p 
            {
                font-size: 19px;
                font-weight: 600;
                max-width: 700px;
                margin: 0 auto;
                color: #e7eefa;
            }

        </style>
    </head>

    <body>
        <header>
            <div class="brand">
                <img src="assets/game_graphics/main_logo.png" alt="Scytheful logo">
                <span>
                    Scytheful - Official Site
                </span>
            </div>
            <nav>
                <a href="/">Home</a>
                <a href="about-the-game">About the Game</a>
                <a href="download-links">Download Links</a>
                <a href="known-issues">Known Issues</a>
                <a href="future-plans">Future Plans</a>
                <a href="contributors" class="active">Contributors</a>
            </nav>
        </header>
        
    <section class="hero">
        <h1>
            Contributors
        </h1>

        <p>
            View who's contributed to Scytheful throughout its development, DEMOS and forward!
        </p>
    </section>

    <br>
    <br>

    <b>
        Under construction
    </b>
    </body>
</html>
